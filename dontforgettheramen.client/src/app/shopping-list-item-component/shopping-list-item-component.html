<div class="mb-2">
  <p-card header="{{ !skelleton ? getTitle() : '' }}" class="border-round border-1 surface-border mr-0 ml-0 pr-0 pl-0">
    @if (!skelleton) {
    <div class="flex flex-row justify-content-between">
      <div>
        <span class="font-italic">{{item.description}}</span>
        <div class="flex flex-row">
          <span class="pi pi-euro mt-3 mr-1 mb-0"></span>
          <p class="mr-5 mb-0">{{item.price}}</p>
          <span class="pi pi-shopping-cart mt-3 mr-1 mb-0"></span>
          <p class="mr-5 mb-0">{{item.placeToBuy}}</p>
          <span class="pi pi-user mt-3 mr-1 mb-0"></span>
          <p class="mr-5 mb-0">{{item.createdBy}}</p>
        </div>
      </div>
      <p-checkbox [(ngModel)]="item.checked" [binary]="true" />
    </div>
    }
    @else {
    <p-skeleton width="10rem" class="mb-2" />
    <p-skeleton width="5rem" class="mb-2" />
    <p-skeleton width="5rem" class="mb-2" />
    }
  </p-card>
</div>
