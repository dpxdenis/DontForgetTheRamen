<div class="mb-4 p-8">
  <p-card class="shadow-4">
    <div class="flex flex-column align-items-center justify-content-center h-full w-full gap-3 ">
      <h2>Login</h2>

      <div class="w-20rem flex flex-column gap-3">
        <p-floatlabel variant="in" class="w-full">
          <input pInputText id="username_label" [(ngModel)]="username" autocomplete="off" class="w-full" />
          <label for="username_label">Username</label>
        </p-floatlabel>

        <p-floatlabel variant="in" class="w-full">
          <p-password inputId="password_label" [(ngModel)]="password" autocomplete="off" styleClass="w-full" inputStyleClass="w-full" [feedback]="false" />
          <label for="password_label">Password</label>
        </p-floatlabel>

        <p-button label="Login" styleClass="w-full" (click)="login()" />
        <p-button label="Register" styleClass="mb-8 w-full" (click)="register()" severity="secondary"/>
      </div>
    </div>
  </p-card>
  </div>
