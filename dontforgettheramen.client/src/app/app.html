<div class="card mb-3">
  <p-menubar [model]="items">
    <ng-template #start>
      <p-avatar image="img.png" class="mr-2" size="normal" />
    </ng-template>
    <ng-template #item let-item let-root="root">
      <a pRipple class="flex items-center px-2 py-1 cursor-pointer gap-2">
        <span class="p-menubar-item-icon {{ item.icon }}"></span>
        <span>{{ item.label }}</span>
        <p-badge *ngIf="item.badge" [ngClass]="{ 'ms-auto': !root }" [value]="item.badge" />
        <span *ngIf="item.shortcut" class="ms-auto border border-surface rounded bg-emphasis text-muted-color text-xs p-1">{{ item.shortcut }}</span>
        <i *ngIf="item.items" [ngClass]="['ms-auto pi', root ? 'pi-angle-down' : 'pi-angle-right']"></i>
      </a>
    </ng-template>
    <ng-template #end>
      <div class="flex align-items-center gap-2">
        <span>@username</span>
        <p-avatar icon="pi pi-user" shape="circle" />
      </div>
    </ng-template>
  </p-menubar>
</div>

<app-shopping-list />
