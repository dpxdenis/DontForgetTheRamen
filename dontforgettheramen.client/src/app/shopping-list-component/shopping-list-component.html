<p-button icon="pi pi-plus" label="Add" [rounded]="true" [outlined]="true" styleClass="w-full mb-3" (click)="showAddDialog()" />
<app-shopping-list-item-dialog-component #dialog/>

<p-scrollpanel [style]="{ width: '100%', height: '85vh' }">
  <p-accordion value="0" styleClass="transparent-accordion">
    <p-accordion-panel value="0">
      <p-accordion-header>Open</p-accordion-header>
      <p-accordion-content>
        @if(stateService.items().length > 0) {
        <app-shopping-list-item *ngFor="let item of openItems" [item]="item" />
        }
        @else {
        <app-shopping-list-item [skelleton]="true" />
        }
      </p-accordion-content>
    </p-accordion-panel>
  </p-accordion>

  <p-accordion value="1" class="m-5">
    <p-accordion-panel value="1">
      <p-accordion-header>Closed</p-accordion-header>
      <p-accordion-content>
        @if(stateService.items().length > 0) {
        <app-shopping-list-item *ngFor="let item of closedItems" [item]="item" />
        }
        @else {
        <app-shopping-list-item [skelleton]="true" />
        }
      </p-accordion-content>
    </p-accordion-panel>
  </p-accordion>
</p-scrollpanel>
